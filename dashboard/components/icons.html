<!-- Helper function to insert icons -->
<script>
  function insertIcon(iconName, className = "") {
    const template = document.getElementById(`icon-${iconName}`);
    if (!template) {
      console.warn(`Icon template not found: icon-${iconName}`);
      return "";
    }
    const wrapper = document.createElement("span");
    wrapper.className = `icon ${className}`;
    wrapper.appendChild(template.content.cloneNode(true));
    return wrapper.outerHTML;
  }

  // Make it available globally
  window.insertIcon = insertIcon;
</script>
